<div class="d-flex justify-content-center">


 



<div class="login-box" style="width: 26rem;">
<div style="width: 100%; height: 50px;"></div>



  <div class="login-logo">
     <a href=""><b>Expimed</b></a>
  </div>
  <!-- /.login-logo -->
  <div class="card">
    <div class="card-body login-card-body">
      <p class="login-box-msg">Ingresa con tus datos para iniciar sesión</p>

      <form [formGroup]="userForm" (ngSubmit)="onSubmit()">
        
        <div class="input-group mb-3">
          <input type="text" class="form-control" placeholder="Nombre(s)" name="fname" id="fname" formControlName="fname">
           <div class="invalid-feedback">Entra un nombre valido.</div>
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-user"></span>
            </div>
          </div>
        </div>


          <div class="input-group mb-3">
          <input type="text" class="form-control" placeholder="Apellido(s)" name="lastname" id="lastname" formControlName="lastname">
           <div class="invalid-feedback">Entra un nombre valido.</div>
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-user"></span>
            </div>
          </div>
        </div>
        
        
        <div class="input-group mb-3">
          <input type="email" class="form-control" placeholder="Email" name="email" id="email" formControlName="email" 
          [class.is-invalid]="userForm.get('email')?.invalid && userForm.get('email')?.touched">
           <div class="invalid-feedback">Enter a valid email.</div>
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-envelope"></span>
            </div>
          </div>
        </div>


        <div class="input-group mb-3">
          <input type="password" class="form-control" placeholder="Password" name="password" id="password" formControlName="password">
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-8">
           <div class="form-check">
                  <input class="form-check-input" type="checkbox" value="" id="checkTerminos" name="checkTerminos" formControlName="checkTerminos" />
                  <label class="form-check-label" for="flexCheckDefault">
                    Estoy de acuerdo con los <a href="#">terminos</a>
                  </label>
                </div>
                @if (userForm.get('checkTerminos')?.invalid &&  userForm.get('checkTerminos')?.touched) {
               <div style="color: red;">
                You must accept the terms to proceed.
               </div>
  }
          </div>
          <!-- /.col -->
          <div class="col-4">
            <button type="submit" class="btn btn-primary btn-block" [disabled]="userForm.invalid" >Registrarme.</button>
          </div>
          <!-- /.col -->
        </div>
      </form>
     
    </div>
    <!-- /.login-card-body -->
  </div>
</div>




</div>

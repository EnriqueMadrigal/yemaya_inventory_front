<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">Listado de Unidades básicas</h1>
          </div><!-- /.col -->
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="#">Home</a></li>
            </ol>
          </div><!-- /.col -->
        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->

 <div class="container-fluid">
        <div class="row">
          <div class="col-md-6">
            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Unidades básicas</h3>
                <button type="button" class="btn btn-primary float-right" (click)="clickunidadbasicaNueva()"><i class="fa fa-plus" aria-hidden="true"></i>Agregar</button>
              </div>
              <!-- /.card-header -->
              <div class="card-body">
                <table class="table table-bordered">
                  <thead>
                    <tr>
                      <th style="width: 10px">#</th>
                      <th>Nombre</th>
                      <th style="width: 40px">Acciones</th>
                    </tr>
                  </thead>
                  <tbody>

                    @for (unidad of unidadbasicas(); track unidad.id; let i =$index;) {
                      <tr>
                      <td>{{i + 1}}</td>
                      <td>{{unidad.nombre}}</td>
                      
                      <td class="text-nowrap">
                        <a class="deco-none" [routerLink]="['/editFamilia', unidad.id]" routerLinkActive="active"><i class="fas fa-pen" style="color: green;"></i></a>
                        <button type=button class="btn deco-none"  (click)="clickDelete(unidad.id)"><i class="fas fa-trash" style="color: red;"></i></button>
                      </td>
                    </tr>
                    




                    } @empty {
                      <td>No tiene familias</td>

                    }


                    
                  </tbody>
                </table>
              </div>
              <!-- /.card-body -->
              <div class="card-footer clearfix">
                <ul class="pagination pagination-sm m-0 float-right">
                  <li class="page-item"><a class="page-link" href="#">&laquo;</a></li>
                  <li class="page-item"><a class="page-link" href="#">1</a></li>
                  <li class="page-item"><a class="page-link" href="#">2</a></li>
                  <li class="page-item"><a class="page-link" href="#">3</a></li>
                  <li class="page-item"><a class="page-link" href="#">&raquo;</a></li>
                </ul>
              </div>
            </div>

        </div>


    </div>

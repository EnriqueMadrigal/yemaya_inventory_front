<div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <div class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1 class="m-0">Agregar nuevo paciente</h1>
          </div><!-- /.col -->
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="#">Home</a></li>
            </ol>
          </div><!-- /.col -->
        </div><!-- /.row -->
      </div><!-- /.container-fluid -->
    </div>
    <!-- /.content-header -->

<div class="card-body">
      <form [formGroup]="pacienteForm" (ngSubmit)="onSubmit()">
        
        <!-- Datos Personales -->
        <h5 class="text-secondary border-bottom pb-2 mb-3">Datos Personales</h5>
        <div class="row g-3 mb-4">
          <div class="col-md-4">
            <label class="form-label">Nombre(s) <span class="text-danger">*</span></label>
            <input type="text" class="form-control" formControlName="Nombres" 
                   [class.is-invalid]="pacienteForm.get('Nombres')?.touched && pacienteForm.get('Nombres')?.invalid">
          </div>
          <div class="col-md-4">
            <label class="form-label">Apellido Paterno</label>
            <input type="text" class="form-control" formControlName="Apaterno">
          </div>
          <div class="col-md-4">
            <label class="form-label">Apellido Materno</label>
            <input type="text" class="form-control" formControlName="Amaterno">
          </div>
          </div>
          <div class="row g-3 mb-4">
          <div class="col-md-4">
            <label class="form-label">Fecha de Nacimiento</label>
            <input type="date" class="form-control" formControlName="FechaNac">
          </div>
          <div class="col-md-4">
            <label class="form-label">Sexo:  &nbsp;</label>
            <select class="form-select" formControlName="sexo">
              <option [value]="1">Masculino</option>
              <option [value]="2">Femenino</option>
            </select>
          </div>
          <div class="col-md-4">
          <label class="form-label">Estado Civil: &nbsp;</label>
            <select class="form-select" formControlName="estadocivil">
              <option [value]="1">Soltero/a</option>
              <option [value]="2">Casado/a</option>
              <option [value]="3">Divorciado/a</option>
            </select>
          </div>
        </div>
    
        <!-- Contacto y Dirección -->
        <h5 class="text-secondary border-bottom pb-2 mb-3">Contacto y Dirección</h5>
        <div class="row g-3 mb-4">
          
            <div class="col-md-4">
            <label class="form-label">Correo Electrónico</label>
            <input type="email" class="form-control" formControlName="email">
          </div>
          <div class="col-md-4">
            <label class="form-label">Teléfono Celular</label>
            <input type="text" class="form-control" formControlName="telefonoCelular">
          </div>

          <div class="col-md-4">
            <label class="form-label">Contacto Urgencias</label>
            <input type="text" class="form-control" formControlName="urgencia">
          </div>
          </div>

          <div class="row g-3 mb-4">
          <div class="col-md-5">
            <label class="form-label">Calle</label>
            <input type="text" class="form-control" formControlName="calle">
          </div>
          <div class="col-md-4">
            <label class="form-label">Colonia</label>
            <input type="text" class="form-control" formControlName="colonia">
          </div>
          </div>


          <div class="row g-3 mb-4">

          <div class="col-md-1">
            <label class="form-label">Exterior.</label>
            <input type="text" class="form-control" formControlName="numext">
          </div>

          <div class="col-md-1">
            <label class="form-label">Interior.</label>
            <input type="text" class="form-control" formControlName="numint">
          </div>
          
          
          <div class="col-md-2">
            <label class="form-label">C.P.</label>
            <input type="number" class="form-control" formControlName="cp">
          </div>
        </div>
        <!-- Otros Datos -->
        <h5 class="text-secondary border-bottom pb-2 mb-3">Información Adicional</h5>
        <div class="row g-3 mb-4 align-items-end">
          <div class="col-md-4">
            <label class="form-label">Tipo de Sangre: </label>
            <select class="form-select" formControlName="tiposangre">
              <option [value]="1">O+</option>
              <option [value]="2">A+</option>
              <option [value]="3">B+</option>
              <option [value]="4">AB+</option>
            </select>
          </div>
          <div class="col-md-4">
            <div class="form-check mb-2">
              <input class="form-check-input" type="checkbox" id="notifCheck" formControlName="notificacion">
              <label class="form-check-label" for="notifCheck">
                Activar notificaciones
              </label>
            </div>
          </div>
          <div class="col-12">
            <label class="form-label">Comentarios / Observaciones</label>
            <textarea class="form-control" rows="2" formControlName="comentarios"></textarea>
          </div>
        </div>
        <div class="d-grid gap-2 d-md-flex justify-content-md-end">
          <button type="button" class="btn btn-secondary me-md-2">Cancelar</button>
          <button type="submit" class="btn btn-primary" [disabled]="pacienteForm.invalid">
            Guardar Paciente
            <span class="spinner-border spinner-border-sm" aria-hidden="true" [hidden]="!isLoading"></span> 
          </button>
        </div>
      </form>
    </div>



<!-- Formulario-->    
</div>
